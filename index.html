  <main class="main">
    <div class="container">
      <section class="hero">
        <h1 class="hero-title">
          <span class="hero-line">Curated Design</span>
          <span class="hero-line gradient-text">Resources & Tools</span>
        </h1>
        <p class="hero-subtitle">A handpicked collection of design tools, inspiration, assets, and references for the Hello Robo team.</p>
      </section>

      <div class="filters-section">
        <div class="filters-scroll">
          <button class="filter-btn active" data-filter="all">All</button>
        </div>
      </div>

      <div id="grid" class="resources-grid"></div>

      <div id="empty" class="empty-state" style="display:none">
        <div class="empty-icon">?</div>
        <p>No resources match your search</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Hello Robo Design Library</p>
    </div>
  </footer>

  <!-- Add Resource FAB -->
  <button id="fab-add" class="fab" aria-label="Add resource">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M11 0H9v9H0v2h9v9h2v-9h9V9h-9z"/></svg>
  </button>

  <!-- Add Resource Modal -->
  <div id="add-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Add Resource</h2>
        <button id="modal-close" class="modal-close">&times;</button>
      </div>
      <form id="add-form" class="modal-form">
        <div class="form-group">
          <label class="form-label" for="add-url">Website URL</label>
          <input class="form-input" type="url" id="add-url" placeholder="https://example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Types</label>
          <div id="add-types" class="type-chips"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="add-custom-type">Custom type</label>
          <input class="form-input" type="text" id="add-custom-type" placeholder="Add a new type..." />
        </div>
        <button class="form-submit" type="submit">Add to Library</button>
      </form>
    </div>
  </div>

  <script src="main.js?v=12"></script>
